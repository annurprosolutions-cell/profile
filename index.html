    <!-- Google Fonts: Space Grotesk (Tech) & Outfit (Display) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Three.js for 3D Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>

            theme: {
                extend: {
                    fontFamily: {
                        'tech': ['Space Grotesk', 'sans-serif'],
                        'display': ['Outfit', 'sans-serif'],

                    colors: {
                        cyber: {
                            dark: '#050914',
                            card: 'rgba(10, 15, 30, 0.6)',
                            border: 'rgba(0, 243, 255, 0.2)',

                            blue: '#0066ff',

    <style>
        :root {
            /* Menyamakan saiz hexagon utama dan satellite kepada 240px */
            --hex-size: 240px;
            --center-hex-size: 240px;
        }

        body {
            background-color: #050914;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(176, 38, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 102, 255, 0.1) 0%, transparent 60%);
            background-attachment: fixed;
            color: #ffffff;
            overflow-x: hidden;
            cursor: none; /* Custom cursor */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(5, 9, 20, 0.8); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 243, 255, 0.6); }

        /* Background Canvas */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; opacity: 0.6; pointer-events: none;
        }

        /* Custom Cursor */
        .cursor-dot {
            width: 8px; height: 8px; background: #00f3ff; border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%); box-shadow: 0 0 10px #00f3ff;
            transition: width 0.2s, height 0.2s, background 0.2s;
        }
        .cursor-ring {
            width: 30px; height: 30px; border: 1px solid rgba(0, 243, 255, 0.5);
            border-radius: 50%; position: fixed; pointer-events: none; z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out, width 0.2s, height 0.2s, border-color 0.2s;
        }
        
        /* Interactive Hover State for Cursor */
        body:has(.interactive:hover) .cursor-dot {
            width: 12px; height: 12px; background: #b026ff; box-shadow: 0 0 15px #b026ff;
        }
        body:has(.interactive:hover) .cursor-ring {
            width: 50px; height: 50px; border-color: rgba(176, 38, 255, 0.8);
            transform: translate(-50%, -50%) scale(1.2);
        }

        /* Hexagon Grid Container */
        #hub-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* Dibesarkan ke 1000px supaya menampung saiz hexagon 240px yang sekata */
        .hex-grid {
            position: relative; width: 1000px; height: 1000px;
            transform-origin: center;
        }
        @media (max-width: 1200px) { .hex-grid { transform: scale(0.85); } }
        @media (max-width: 1024px) { .hex-grid { transform: scale(0.7); } }
        @media (max-width: 768px) { .hex-grid { transform: scale(0.5); } }
        @media (max-width: 480px) { .hex-grid { transform: scale(0.35); } }

        /* SVG Connection Lines */
        #connection-lines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .conn-line {
            stroke: rgba(0, 243, 255, 0.2); stroke-width: 2;
            stroke-dasharray: 10 5;
            animation: dashMove 20s linear infinite;
            transition: stroke 0.3s, filter 0.3s;
        }
        @keyframes dashMove { to { stroke-dashoffset: 1000; } }

        /* Generic Hex Wrapper */
        .hex-wrapper {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Shape via Clip Path for inner content - FLAT-TOPPED */
        .hex-shape {
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            background: var(--glass-bg, rgba(10, 15, 30, 0.6));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative;
        }

        /* Inline SVG for glowing borders */
        .hex-border-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
            overflow: visible;
        }
        .hex-border-polygon {
            fill: none;
            stroke: var(--hex-color, rgba(0, 243, 255, 0.3));
            stroke-width: 3;
            transition: stroke 0.3s, filter 0.3s;
            vector-effect: non-scaling-stroke;
        }

        /* Center Identity Hexagon */
        .hex-center-wrapper {
            top: 50%; left: 50%;
            height: var(--center-hex-size); width: calc(var(--center-hex-size) * 1.1547);
            z-index: 20; cursor: default;
        }
        .hex-center-wrapper .hex-shape {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(10,15,30,0.8) 0%, rgba(5,9,20,0.9) 100%);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Pulse effect for center */
        .pulse-ring {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.3);
            animation: pulseAnim 3s infinite ease-out;
            z-index: -1; pointer-events: none;
        }
        @keyframes pulseAnim {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* Satellite Hexagons */
        .satellite-hex {
            height: var(--hex-size); width: calc(var(--hex-size) * 1.1547);
        }
        .satellite-hex .hex-shape { width: 100%; height: 100%; }
        
        /* 
           Positioning - Exact Honeycomb Grid for 1000x1000 space 
           Koordinat diselaraskan khusus untuk jarak gap 10px dengan saiz hex 240px
        */
        .hex-01 { top: 25%; left: 50%; --hex-color: #b026ff; } /* Top - Purple */
        .hex-02 { top: 37.5%; left: 71.6%; --hex-color: #00f3ff; } /* Top Right - Cyan */
        .hex-03 { top: 62.5%; left: 71.6%; --hex-color: #0066ff; } /* Bottom Right - Blue */
        .hex-04 { top: 75%; left: 50%; --hex-color: #ff0055; } /* Bottom - Pink/Red */
        .hex-05 { top: 62.5%; left: 28.4%; --hex-color: #ffb300; } /* Bottom Left - Orange/Gold */
        .hex-06 { top: 37.5%; left: 28.4%; --hex-color: #00ff88; } /* Top Left - Green */

        /* Hover Effects */
        .satellite-hex:hover {
            transform: translate(-50%, -50%) scale(1.08);
            z-index: 30;
        }
        .satellite-hex:hover .hex-shape { background: rgba(20, 25, 45, 0.8); }
        .satellite-hex:hover .hex-border-polygon {
            filter: drop-shadow(0 0 10px var(--hex-color)) drop-shadow(0 0 20px var(--hex-color));
            stroke-width: 4;
        }
        
        .hex-icon { font-size: 3rem; color: var(--hex-color); margin-bottom: 0.75rem; transition: transform 0.3s; }
        .satellite-hex:hover .hex-icon { transform: translateY(-5px); }
        .hex-title { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 1.25rem; letter-spacing: 0.05em; text-transform: uppercase; color: #fff; }

        /* Modal / Popup Styles */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 9, 20, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease; display: flex; align-items: center; justify-content: center;
        }
        #modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .modal-content {
            background: linear-gradient(180deg, rgba(20, 25, 45, 0.9) 0%, rgba(10, 15, 30, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1); border-top: 2px solid var(--modal-color, #00f3ff);
            border-radius: 24px; width: 90%; max-width: 600px;
            transform: translateY(50px) scale(0.95); opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(var(--modal-color-rgb), 0.2);
            overflow: hidden;
        }
        #modal-overlay.active .modal-content { transform: translateY(0) scale(1); opacity: 1; }

        /* Dedicated Page View */
        #page-view {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050914; z-index: 50; overflow-y: auto; overflow-x: hidden;
        }
        #page-view.active { display: block; animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .glass-panel {
            background: rgba(15, 20, 35, 0.6); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px;
        }
        
        .glowing-text {
            text-shadow: 0 0 20px currentColor;
        }

        /* Progress bars for skills */
        .progress-bar-bg { background: rgba(255, 255, 255, 0.1); border-radius: 999px; height: 6px; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 999px; box-shadow: 0 0 10px currentColor; }
    </style>
</head>

                            <div class="flex justify-between text-xs mb-1"><span class="text-white">Frontend (React/Vue/Vanilla)</span><span class="text-[#ff0055]">90%</span></div>
                            <div class="progress-bar-bg"><div class="progress-bar-fill text-[#ff0055] bg-[#ff0055]" style="width: 90%"></div></div>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs mb-1"><span class="text-white">Prompt Engineering & AI</span><span class="text-[#ff0055]">85%</span></div>
                            <div class="progress-bar-bg"><div class="progress-bar-fill text-[#ff0055] bg-[#ff0055]" style="width: 85%"></div></div>
                        </div>
                        <div class="flex flex-wrap gap-2 pt-2">
                            <span class="px-2 py-1 bg-white/5 border border-white/10 rounded text-[10px] text-gray-300">Figma</span>
                            <span class="px-2 py-1 bg-white/5 border border-white/10 rounded text-[10px] text-gray-300">Tailwind</span>
                            <span class="px-2 py-1 bg-white/5 border border-white/10 rounded text-[10px] text-gray-300">Firebase</span>
                            <span class="px-2 py-1 bg-white/5 border border-white/10 rounded text-[10px] text-gray-300">Three.js</span>
                        </div>
                    </div>
                `
            },
            testimonials: {
                color: '#ffb300', rgb: '255, 179, 0', icon: 'fa-comment-dots', title: 'Testimonials',
                summary: 'What clients, colleagues, and collaborators say about my work and impact.',
                details: `
                    <div class="relative w-full overflow-hidden glass-panel p-6">
                        <div class="text-[#ffb300] text-2xl mb-2"><i class="fas fa-quote-left"></i></div>
                        <p class="text-gray-300 text-sm italic mb-4">"RuzPrompt didn't just design an interface; they created an entire digital ecosystem that transformed our user retention metrics. Absolutely visionary work."</p>
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gray-700"></div>
                            <div>
                                <div class="text-white font-bold text-sm">Sarah Jenkins</div>
                                <div class="text-gray-500 text-xs">CEO, TechNova</div>
                            </div>
                        </div>
                    </div>
                `
            },
            connect: {
                color: '#00ff88', rgb: '0, 255, 136', icon: 'fa-envelope-open-text', title: 'Connect',
                summary: 'Let’s build the future together. Reach out for collaborations or just to say hi.',
                details: `
                    <div class="grid grid-cols-2 gap-3">
                        <a href="#" class="interactive flex flex-col items-center justify-center p-4 glass-panel hover:bg-white/5 transition-colors border border-transparent hover:border-[#00ff88]/50 group">
                            <i class="fab fa-linkedin text-2xl text-gray-400 group-hover:text-[#00ff88] mb-2 transition-colors"></i>
                            <span class="text-xs text-gray-300">LinkedIn</span>
                        </a>
                        <a href="#" class="interactive flex flex-col items-center justify-center p-4 glass-panel hover:bg-white/5 transition-colors border border-transparent hover:border-[#00ff88]/50 group">
                            <i class="fab fa-github text-2xl text-gray-400 group-hover:text-[#00ff88] mb-2 transition-colors"></i>
                            <span class="text-xs text-gray-300">GitHub</span>
                        </a>
                        <a href="#" class="interactive flex flex-col items-center justify-center p-4 glass-panel hover:bg-white/5 transition-colors border border-transparent hover:border-[#00ff88]/50 group">
                            <i class="fas fa-envelope text-2xl text-gray-400 group-hover:text-[#00ff88] mb-2 transition-colors"></i>
                            <span class="text-xs text-gray-300">Email</span>
                        </a>
                        <a href="#" class="interactive flex flex-col items-center justify-center p-4 glass-panel hover:bg-white/5 transition-colors border border-transparent hover:border-[#00ff88]/50 group">
                            <i class="fab fa-whatsapp text-2xl text-gray-400 group-hover:text-[#00ff88] mb-2 transition-colors"></i>
                            <span class="text-xs text-gray-300">WhatsApp</span>
                        </a>
                    </div>
                `
            }
        };

        // DOM Elements
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContentBox = document.getElementById('modal-content-box');
        const homeView = document.getElementById('home-view');
        const pageView = document.getElementById('page-view');
        const pageContent = document.getElementById('page-content');
        const backToHubBtn = document.getElementById('back-to-hub');

        // Custom Cursor Logic
        const cursorDot = document.getElementById('cursor-dot');
        const cursorRing = document.getElementById('cursor-ring');
        
        window.addEventListener('mousemove', (e) => {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
            // Slight delay for ring for smooth effect
            setTimeout(() => {
                cursorRing.style.left = e.clientX + 'px';
                cursorRing.style.top = e.clientY + 'px';
            }, 50);
        });

        // Connection Lines Highlighting
        function highlightLine(lineId) {
            const line = document.getElementById(lineId);
            if(line) {
                line.style.stroke = 'rgba(255,255,255,0.8)';
                line.style.filter = 'url(#glow)';
                line.style.strokeWidth = '4';
            }
        }
        function resetLines() {
            document.querySelectorAll('.conn-line').forEach(line => {
                line.style.stroke = 'rgba(0, 243, 255, 0.2)';
                line.style.filter = 'none';
                line.style.strokeWidth = '2';
            });
        }

        // Open Modal Logic
        document.querySelectorAll('.satellite-hex').forEach(hex => {
            hex.addEventListener('click', function() {
                const target = this.getAttribute('data-target');
                const data = contentData[target];
                
                if(!data) return;

                // Build Modal HTML
                const modalHTML = `
                    <div style="--modal-color: ${data.color}; --modal-color-rgb: ${data.rgb};">
                        <!-- Header -->
                        <div class="px-6 py-4 flex justify-between items-center border-b border-white/5 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-${data.color} to-transparent opacity-50"></div>
                            <div class="flex items-center gap-3">
                                <i class="fas ${data.icon} text-2xl" style="color: ${data.color}"></i>
                                <h2 class="font-display text-2xl font-bold tracking-wide text-white uppercase">${data.title}</h2>
                            </div>
                            <button class="interactive close-modal w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        
                        <!-- Body -->
                        <div class="px-6 py-6 font-tech">
                            <p class="text-gray-300 mb-6 leading-relaxed text-sm">${data.summary}</p>
                            ${data.details}
                        </div>
                        
                        <!-- Footer / CTA -->
                        <div class="px-6 py-4 border-t border-white/5 bg-black/20 flex justify-end">
                            <button class="interactive open-page-btn px-6 py-2 rounded font-tech text-sm font-bold text-white transition-all hover:scale-105 shadow-[0_0_15px_rgba(var(--modal-color-rgb),0.4)]" 
                                    style="background-color: ${data.color}" data-target="${target}">
                                Open Full Page <i class="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </div>
                `;
                
                modalContentBox.innerHTML = modalHTML;
                modalOverlay.classList.add('active');

                // Attach Close Event
                modalContentBox.querySelector('.close-modal').addEventListener('click', closeModal);
                
                // Attach Open Page Event
                modalContentBox.querySelector('.open-page-btn').addEventListener('click', function() {
                    openFullPage(this.getAttribute('data-target'));
                });
            });
        });

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // Close modal on outside click or ESC
        modalOverlay.addEventListener('click', (e) => {
            if(e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
        });

        // Open Full Page Logic
        function openFullPage(target) {
            closeModal();
            const data = contentData[target];
            
            // Construct a basic full page layout based on the data
            const pageHTML = `
                <div class="mb-12">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl glass-panel mb-6" style="color: ${data.color}; box-shadow: 0 0 20px rgba(${data.rgb}, 0.3)">
                        <i class="fas ${data.icon} text-3xl"></i>
                    </div>
                    <h1 class="font-display text-5xl md:text-7xl font-bold text-white uppercase tracking-tight mb-4 glowing-text" style="color: ${data.color}">${data.title}</h1>
                    <p class="font-tech text-xl text-gray-400 max-w-2xl">${data.summary}</p>
                </div>
                
                <div class="grid md:grid-cols-3 gap-8">
                    <div class="md:col-span-2 space-y-8">
                        <div class="glass-panel p-8">
                            <h2 class="font-display text-2xl font-semibold text-white mb-6 border-b border-white/10 pb-2">Detailed Overview</h2>
                            ${data.details}
                            <!-- Mock expanded content for full page -->
                            <div class="mt-8 p-4 bg-black/30 rounded border border-white/5 text-gray-400 font-tech text-sm leading-loose">
                                <p>This is the full expanded view for the <strong>${data.title}</strong> section. In a complete production application, this area would fetch detailed modular components like interactive timelines, draggable carousels, masonry image galleries, or embedded PDF viewers specific to this category.</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="space-y-6">
                        <div class="glass-panel p-6">
                            <h3 class="font-tech text-sm text-gray-500 uppercase tracking-widest mb-4">Quick Stats</h3>
                            <div class="space-y-4">
                                <div>
                                    <div class="text-white text-2xl font-bold" style="color: ${data.color}">100%</div>
                                    <div class="text-gray-400 text-xs uppercase">Completion</div>
                                </div>
                                <div>
                                    <div class="text-white text-2xl font-bold" style="color: ${data.color}">24/7</div>
                                    <div class="text-gray-400 text-xs uppercase">Availability</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            pageContent.innerHTML = pageHTML;
            
            // Transition Views
            homeView.style.opacity = '0';
            setTimeout(() => {
                homeView.style.display = 'none';
                pageView.classList.add('active');
                window.scrollTo(0,0);
            }, 300);
        }

        // Back to Hub Logic
        backToHubBtn.addEventListener('click', () => {
            pageView.classList.remove('active');
            setTimeout(() => {
                pageView.style.display = 'none';
                homeView.style.display = 'block';
                // Trigger reflow
                void homeView.offsetWidth;
                homeView.style.opacity = '1';
                homeView.style.transition = 'opacity 0.5s ease-in';
            }, 300);
        });

        // Interactive class management for cursor
        document.querySelectorAll('button, a, .satellite-hex').forEach(el => {
            el.classList.add('interactive');
        });

        // --------------------------------------------------------
        // Three.js Background Particles (Cyberpunk/Space Vibe)
        // --------------------------------------------------------
        const initThreeJS = () => {
            const canvas = document.getElementById('bg-canvas');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            camera.position.z = 30;

            // Create particles
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 700;
            const posArray = new Float32Array(particlesCount * 3);
            
            for(let i = 0; i < particlesCount * 3; i++) {
                // Spread particles widely
                posArray[i] = (Math.random() - 0.5) * 100;
            }
            
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            // Custom shader material for glowing dots
            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.15,
                color: 0x00f3ff,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            const particleMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particleMesh);

            // Mouse interaction setup
            let mouseX = 0;
            let mouseY = 0;
            let targetX = 0;
            let targetY = 0;
            const windowHalfX = window.innerWidth / 2;
            const windowHalfY = window.innerHeight / 2;

            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX - windowHalfX);
                mouseY = (event.clientY - windowHalfY);
            });

            // Animation Loop
            const clock = new THREE.Clock();

            const animate = () => {
                requestAnimationFrame(animate);
                const elapsedTime = clock.getElapsedTime();

                // Slow rotation
                particleMesh.rotation.y = elapsedTime * 0.05;
                particleMesh.rotation.x = elapsedTime * 0.02;

                // Mouse parallax effect
                targetX = mouseX * 0.001;
                targetY = mouseY * 0.001;
                
                particleMesh.rotation.y += 0.05 * (targetX - particleMesh.rotation.y);
                particleMesh.rotation.x += 0.05 * (targetY - particleMesh.rotation.x);

                renderer.render(scene, camera);
            };
            
            // Start animation after load
            window.onload = function() {
                animate();
            };

            // Handle Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };

        // Initialize 3D bg
        initThreeJS();

    </script>
</body>
</html>
